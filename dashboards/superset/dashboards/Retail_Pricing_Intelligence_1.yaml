css: "/* page */\n.dashboard, .dashboard-content, .grid-container { background: #f1f4f9\
  \ !important; }\n\n/* dashboard title */\n.dashboard-header-container .ant-input,\
  \ .dashboard-header-container .input-sizer,\n.dashboard-header-container .editable-title\
  \ { font-size: 28px !important; font-weight: 700 !important; color: #0f172a !important;\
  \ }\n\n/* cards */\n.dashboard-component-chart-holder, .dashboard-markdown {\n \
  \ background: #ffffff !important; border: 1px solid #e2e8f0 !important;\n  border-radius:\
  \ 12px !important; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06) !important;\n}\n\
  .dashboard-component-chart-holder .header-title { font-size: 16px !important; font-weight:\
  \ 700 !important; color: #0f172a !important; }\n.dashboard-markdown h2 { font-size:\
  \ 20px !important; font-weight: 700 !important; color: #0f172a !important; }\n.dashboard-markdown,\
  \ .dashboard-markdown p { color: #475569 !important; }\n.dashboard-markdown strong\
  \ { color: #0f172a !important; }\n\n/* KPI cards: small muted label, big coloured\
  \ number (matched by chart name: ids change on import) */\n[data-test-chart-name=\"\
  Records in last successful crawl\"] .header-title, [data-test-chart-name=\"Last\
  \ successful crawl\"] .header-title, [data-test-chart-name=\"Hours since last successful\
  \ crawl\"] .header-title {\n  font-size: 14px !important; font-weight: 400 !important;\
  \ color: #64748b !important;\n}\n[data-test-chart-name=\"Records in last successful\
  \ crawl\"] .header-line, [data-test-chart-name=\"Hours since last successful crawl\"\
  ] .header-line { font-weight: 700 !important; }\n[data-test-chart-name=\"Records\
  \ in last successful crawl\"] .header-line { color: #16a34a !important; }\n[data-test-chart-name=\"\
  Hours since last successful crawl\"] .header-line { color: #0284c7 !important; }\n\
  /* first KPI is a one-row table: the header stays in the layout (Superset measures\
  \ it before showing the table), just invisible */\n.dashboard-component-chart-holder\
  \ [data-test-chart-name=\"Last successful crawl\"] table.table thead th { height:\
  \ 0 !important; padding: 0 !important; border: 0 !important; font-size: 0 !important;\
  \ line-height: 0 !important; opacity: 0 !important; }\n.dashboard-component-chart-holder\
  \ [data-test-chart-name=\"Last successful crawl\"] table.table tbody tr:not(:first-child)\
  \ { display: none !important; }\n.dashboard-component-chart-holder [data-test-chart-name=\"\
  Last successful crawl\"] table.table td { font-size: 34px !important; font-weight:\
  \ 700 !important; color: #2563eb !important; border: 0 !important; padding: 18px\
  \ 6px !important; }\n\n/* KPI values centred in their cards */\n[data-test-chart-name=\"\
  Records in last successful crawl\"] .superset-legacy-chart-big-number, [data-test-chart-name=\"\
  Hours since last successful crawl\"] .superset-legacy-chart-big-number {\n  display:\
  \ flex !important; flex-direction: column !important; align-items: center !important;\
  \ justify-content: center !important; text-align: center !important;\n}\n[data-test-chart-name=\"\
  Records in last successful crawl\"] .header-line, [data-test-chart-name=\"Hours\
  \ since last successful crawl\"] .header-line { width: 100% !important; text-align:\
  \ center !important; }\n.dashboard-component-chart-holder [data-test-chart-name=\"\
  Last successful crawl\"] table.table { width: 100% !important; }\n.dashboard-component-chart-holder\
  \ [data-test-chart-name=\"Last successful crawl\"] table.table td { text-align:\
  \ center !important; }\n\n/* tables: no heavy cells, thin row separators */\n.dashboard-component-chart-holder\
  \ table.table { background: transparent !important; }\n.dashboard-component-chart-holder\
  \ table.table th {\n  background: transparent !important; color: #475569 !important;\
  \ font-weight: 700 !important;\n  border: 0 !important; border-bottom: 1px solid\
  \ #e2e8f0 !important; padding: 12px 10px !important;\n}\n.dashboard-component-chart-holder\
  \ table.table td {\n  background: transparent !important; color: #0f172a !important;\
  \ border: 0 !important;\n  border-bottom: 1px solid #edf1f6 !important; padding:\
  \ 11px 10px !important;\n}\n.dashboard-component-chart-holder table.table tbody\
  \ tr,\n.dashboard-component-chart-holder table.table.table-striped > tbody > tr:nth-of-type(odd),\n\
  .dashboard-component-chart-holder table.table.table-striped > tbody > tr:nth-of-type(even)\
  \ { background: transparent !important; }\n.dashboard-component-chart-holder table.table\
  \ tbody tr:hover td { background: rgba(15, 23, 42, 0.04) !important; }\n\n/* table\
  \ search and page-size inputs */\n.dashboard-component-chart-holder select, .dashboard-component-chart-holder\
  \ input[type=\"search\"],\n.dashboard-component-chart-holder input.form-control\
  \ {\n  background: #ffffff !important; color: #0f172a !important; border: 1px solid\
  \ #cbd5e1 !important; border-radius: 8px !important;\n}\n"
