name: pricewatch
version: "1.0.0"
config-version: 2
profile: pricewatch

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: ["target"]

# One folder and one database schema per layer (raw is written by the crawler only).
models:
  pricewatch:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
      # Only these two roles exist besides the owner, and they may only read gold.
      +grants:
        select: ["api_app", "bi_reader"]

seeds:
  pricewatch:
    +schema: silver

vars:
  # How far back the incremental fact re-reads raw inserts, to absorb clock skew between
  # the loader and the database (the watermark is inserted_at).
  incremental_lookback_hours: 1
  # Above this share of single-platform sample listings, matching is probably broken (warn).
  max_unmatched_sample_ratio: 0.5
